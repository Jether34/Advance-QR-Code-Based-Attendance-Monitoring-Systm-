<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - Design Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 18% 20%, rgba(34, 211, 238, 0.12), transparent 34%),
                radial-gradient(circle at 82% -10%, rgba(34, 197, 94, 0.1), transparent 38%),
                linear-gradient(140deg, #0c1426 0%, #102035 50%, #0c2841 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 26px;
            color: #0f172a;
        }

        .login-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 28px 80px rgba(8, 47, 73, 0.22);
            border: 1px solid #e2e8f0;
            padding: 42px 36px;
            max-width: 640px;
            width: 100%;
        }

        .logo-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo-placeholder {
            width: 92px;
            height: 92px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5em;
            font-weight: 800;
        }

        .school-name {
            color: #0ea5e9;
            font-size: 1.2em;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #0ea5e9;
            font-size: 2.1em;
            margin-bottom: 8px;
            letter-spacing: 0.01em;
        }

        .login-header p {
            color: #475569;
            font-size: 0.98em;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0f172a;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d7e0eb;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #f7f9fc;
        }

        .form-group input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.16);
            background: #ffffff;
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #0ea5e9 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(14, 165, 233, 0.28);
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
            color: #475569;
        }

        .form-footer a {
            color: #0ea5e9;
            font-weight: 700;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-header">
            <div class="logo-placeholder">📚</div>
            <div class="school-name">Palawan National School</div>
        </div>
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Hybrid QR Code Based Attendance System</p>
        </div>
        <form>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" value="student@pns.edu">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" value="••••••••">
            </div>
            <button type="button" class="btn-login">Login</button>
        </form>
        <div class="form-footer">
            <p>Don't have an account? <a href="#">Sign up here</a></p>
            <p><a href="#">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>
