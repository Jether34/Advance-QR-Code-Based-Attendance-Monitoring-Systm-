name: Generate icons and WebP logo

on:
  push:
    branches:
      - main
      - update-2025-11-dev-qr

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, imagick

      - name: Convert logo to WebP (best-effort)
        run: php tools/convert_logo_to_webp.php || true

      - name: Generate icons
        run: php tools/generate_icons.php

      - name: Minify CSS (create style.min.css)
        run: php tools/minify_css.php || true

      - name: Commit regenerated icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/icons || true
          git add style.min.css || true
          git commit -m "chore(ci): regenerate icons and minify CSS (automated)" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed or no permission"
