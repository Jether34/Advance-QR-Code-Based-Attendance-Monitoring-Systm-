<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Page - Design Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 14% 16%, rgba(34, 211, 238, 0.12), transparent 38%),
                radial-gradient(circle at 82% -10%, rgba(34, 197, 94, 0.1), transparent 44%),
                linear-gradient(135deg, #0c1426 0%, #102035 55%, #0c2841 100%);
            min-height: 100vh;
            color: #0f172a;
        }

        h1 {
            text-align: center;
            color: #0ea5e9;
            margin-bottom: 20px;
            padding: 20px;
            letter-spacing: 0.01em;
            font-size: 2em;
        }

        h3 {
            color: #0f172a;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .scanner-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            max-width: 920px;
            margin: 0 auto;
            padding: 20px;
        }

        .scanner-section {
            flex: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 18px 40px rgba(8, 47, 73, 0.12);
        }

        #barcodeInput {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #d7e0eb;
            border-radius: 10px;
            transition: border-color 0.25s, box-shadow 0.25s;
            background: #f7f9fc;
            font-family: inherit;
        }

        #barcodeInput:focus {
            border-color: #0ea5e9;
            outline: none;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.16);
            background: #fff;
        }

        .qr-placeholder {
            width: 400px;
            height: 300px;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5em;
            color: #0ea5e9;
            border: 2px dashed #bae6fd;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%);
            color: #166534;
            border: 1px solid #bbf7d0;
            text-align: center;
        }

        .result-box .student-info {
            margin-top: 10px;
            font-size: 1.1em;
        }

        .result-box .status {
            margin-top: 8px;
            padding: 8px 16px;
            background: #22c55e;
            color: white;
            border-radius: 8px;
            display: inline-block;
            font-size: 0.9em;
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .control-btn {
            flex: 1;
            padding: 16px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 22px rgba(8, 47, 73, 0.3);
            font-family: inherit;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(14, 165, 233, 0.35);
        }

        .control-btn.secondary {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        }
    </style>
</head>
<body>
    <h1>📱 Automatic Attendance Scanner</h1>

    <div class="scanner-container">
        <div class="scanner-section">
            <h3>📷 QR Code Scanner</h3>
            <div class="qr-placeholder">📸</div>
            <div class="control-buttons">
                <button class="control-btn">📷 Start Camera</button>
                <button class="control-btn secondary">✋ Stop</button>
            </div>
        </div>

        <div class="scanner-section">
            <h3>⌨ Manual Barcode Input</h3>
            <input id="barcodeInput" placeholder="Scan or type student ID / barcode" value="2024-12345">

            <div class="result-box">
                <div style="font-size: 2em;">✅</div>
                <div class="student-info">
                    <strong>Juan Dela Cruz</strong><br>
                    Student ID: 2024-12345<br>
                    Grade 12 - STEM
                </div>
                <div class="status">✓ Present - Morning In: 7:30 AM</div>
            </div>
        </div>
    </div>
</body>
</html>
