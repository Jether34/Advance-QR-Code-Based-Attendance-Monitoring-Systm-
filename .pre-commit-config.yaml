repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: 'v1.5.0'
    hooks:
      - id: detect-secrets
        args: ["--baseline", "tools/detect_secrets.baseline", "--exclude-files", "vendor/|puta-lighthouse.*|tools/detect_secrets\\.baseline"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
